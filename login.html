<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Level Up - Gamer Shop</title>
  <link rel="stylesheet" href="css/login.css">
</head>
<body>

  <header>
    <div class="logo">Level Up - <span>GAMER SHOP</span></div>
    <nav>
      <ul>
        <li><a href="index.html">Inicio</a></li>
        <li><a href="about.html">Sobre nosotros</a></li>
        <li><a href="productos.html">Productos</a></li>
        <li><a href="login.html" class="active">Login</a></li>
      </ul>
    </nav>
  </header>

  <main class="forms-wrapper">
    
    <!-- REGISTRO DE USUARIO -->
    <div class="card">
      <h2>Registro</h2>
      <form id="formRegistro">
        <div class="form-group">
          <label for="nombre">Nombre</label>
          <input type="text" id="nombre" placeholder="Tu nombre" required>
        </div>

        <div class="form-group">
          <label for="edad">Edad</label>
          <input type="number" id="edad" placeholder="Tu edad" required>
        </div>

        <div class="form-group">
          <label for="correo">Correo (agrega @duocuc.cl para descuento)</label>
          <input type="email" id="correo" placeholder="correo@duocuc.cl" required>
        </div>

        <div class="form-group">
          <label for="contraseña">Contraseña</label>
          <input type="password" id="contraseña" placeholder="••••••••" required>
        </div>

        <div class="form-group">
          <label for="contraseña2">Confirmar Contraseña</label>
          <input type="password" id="contraseña2" placeholder="••••••••" required>
        </div>

        <button type="submit" class="btn">Registrarse</button>
      </form>
    </div>

    <!-- INICIAR SESIÓN -->
    <div class="card">
      <h2>Iniciar Sesión</h2>
      <form id="formLogin">
        <div class="form-group">
          <label for="loginCorreo">Correo</label>
          <input type="email" id="loginCorreo" placeholder="correo@duocuc.cl" required>
        </div>

        <div class="form-group">
          <label for="loginContraseña">Contraseña</label>
          <input type="password" id="loginContraseña" placeholder="••••••••" required>
        </div>

        <button type="submit" class="btn btn-secondary">Ingresar</button>
      </form>
    </div>

  </main>

  <footer>
    <p>&copy; 2026 LEVEL UP - Todos los derechos reservados</p>
  </footer>

  <!-- Vinculación con tu archivo JS -->
  <script src="json/login.js"></script>
</body>
</html>
