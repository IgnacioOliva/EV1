<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro y Login</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; }
    .card { border: 1px solid #ccc; padding: 20px; border-radius: 8px; width: 300px; margin-bottom: 20px; }
    .form-group { margin-bottom: 15px; }
    .form-group label { display: block; margin-bottom: 5px; }
    .form-group input { width: 100%; padding: 8px; box-sizing: border-box; }
    button { width: 100%; padding: 10px; background-color: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; }
    button:hover { background-color: #0056b3; }
  </style>
</head>
<body>

<header>
    <h1>Level Up - GAMER SHOP!!!!</h1>
    <nav>
      <ul>
        <li><a href="index.html">Inicio</a></li>
        <li><a href="about.html">Sobre nosotros</a></li>
        <li><a href="contacto.html">Contacto</a></li>
        <li><a href="login.html">Login</a></li>
      </ul>
    </nav>
  </header>

    <main>

  <!-- FORMULARIO DE REGISTRO -->
  <div class="card">
    <h2>Registro</h2>
    <form id="formRegistro">
      <div class="form-group">
        <label for="nombre">Nombre</label>
        <input type="text" id="nombre" required>
      </div>

      <div class="form-group">
        <label for="edad">Edad</label>
        <input type="number" id="edad" required>
      </div>

      <div class="form-group">
        <label for="correo">Correo (agrega @duocuc.cl para descuento)</label>
        <input type="email" id="correo" required>
      </div>

      <div class="form-group">
        <label for="contraseña">Contraseña</label>
        <input type="password" id="contraseña" required>
      </div>

      <div class="form-group">
        <label for="contraseña2">Confirmar Contraseña</label>
        <input type="password" id="contraseña2" required>
      </div>

      <button type="submit">Registrarse</button>
    </form>
  </div>

  <!-- FORMULARIO DE LOGIN -->
  <div class="card">
    <h2>Iniciar Sesión</h2>
    <form id="formLogin">
      <div class="form-group">
        <label for="loginCorreo">Correo</label>
        <input type="email" id="loginCorreo" required>
      </div>

      <div class="form-group">
        <label for="loginContraseña">Contraseña</label>
        <input type="password" id="loginContraseña" required>
      </div>

      <button type="submit">Ingresar</button>
    </form>
  </div>

  </main>

  <!-- Vincular el archivo JS -->
  <script src="json/login.js"></script>


<footer>
    <p>&copy: 2026 LEVEL UP - Todos los derechos reservados</p>
  </footer>
</body>
</html>
