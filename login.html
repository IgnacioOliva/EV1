<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Level Up Gamer Shop</title>
  <link rel="icon" type="image/png" href="imagenes/images-removebg-preview.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Roboto:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="navbar">
    <div class="logo">
      <h1>LEVEL <span>UP</span> - GAMER SHOP</h1>
    </div>
    <nav>
      <ul>
        <li><a href="index.html">Inicio</a></li>
        <li><a href="about.html">Sobre nosotros</a></li>
        <li><a href="contacto.html">Contacto</a></li>
        <li><a href="login.html" class="active">Login</a></li>
      </ul>
    </nav>
  </header>

  <main class="forms-wrapper">
    <!-- REGISTRO DE USUARIO -->
    <div class="card">
      <h2>Registro</h2>
      
      <!-- Mensaje informativo de descuento -->
      <p style="color: var(--primary); font-size: 0.85rem; font-weight: bold; margin-bottom: 15px;">
        Todas las cuentas @duocuc.cl reciben un descuento permanente en todas sus compras.
      </p>

      <form id="formRegistro">
        <div class="form-group">
          <label for="nombre">Nombre</label>
          <input type="text" id="nombre" placeholder="Tu nombre" required>
        </div>

        <div class="form-group">
          <label for="edad">Edad</label>
          <input type="number" id="edad" placeholder="Tu edad" required>
        </div>

        <div class="form-group">
          <label for="correo">Correo</label>
          <input type="email" id="correo" placeholder="correo@duocuc.cl" required>
        </div>

        <div class="form-group">
          <label for="contraseña">Contraseña</label>
          <input type="password" id="contraseña" placeholder="********" required>
        </div>

        <div class="form-group">
          <label for="contraseña2">Confirmar Contraseña</label>
          <input type="password" id="contraseña2" placeholder="********" required>
        </div>

        <button type="submit" class="btn">Registrarse</button>
      </form>
    </div>

    <!-- INICIAR SESIÓN -->
    <div class="card">
      <h2>Iniciar Sesión</h2>
      <form id="formLogin">
        <div class="form-group">
          <label for="loginCorreo">Correo</label>
          <input type="email" id="loginCorreo" placeholder="correo@duocuc.cl" required>
        </div>

        <div class="form-group">
          <label for="loginContraseña">Contraseña</label>
          <input type="password" id="loginContraseña" placeholder="********" required>
        </div>

        <button type="submit" class="btn btn-secondary">Ingresar</button>
      </form>
    </div>
  </main>

  <footer>
    <p>&copy; 2026 LEVEL UP Todos los derechos reservados</p>
  </footer>

  <script src="javaScript/login.js"></script>
</body>
</html>
